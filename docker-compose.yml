services:
  postgres:
    image: postgres:16-alpine
    container_name: luxewear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: luxewear
    ports:
      - "5432:5432"
    volumes:
      - luxewear_pgdata:/var/lib/postgresql/data

volumes:
  luxewear_pgdata:
